<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KRG Flows Handover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Two flows (Italy agency / Hartree buy-back) in one doc. Navy masthead; sticky left rail with a flow switch on top; scroll-spied document per flow. Accent swaps per flow. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f6f8fb; --inset:#eef2f7;
  --border:#d7dee7; --border-strong:#c2cdd9;
  --ink:#162430; --ink-2:#48596a; --ink-3:#7b8a99;
  --brand:#1f4e79; --brand-2:#15385a;
  --accent:#b06a24; --accent-soft:#f3e4d2;
  --good:#2b8a58; --good-soft:#dcefe3;
  --warn:#9a6a10; --warn-soft:#f4e9cf;
  --bad:#bc4038; --bad-soft:#f6ddd9;
  --header-bg:#15385a; --on-header:#e9f1f9; --on-header-dim:#a9c3dc;
  --shadow:0 1px 2px rgba(17,34,51,.06),0 4px 16px rgba(17,34,51,.06);
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --disp:"Archivo","IBM Plex Sans",system-ui,sans-serif;
  color-scheme:light;
}
:root[data-flow="hartree"]{ --accent:#17707f; --accent-soft:#d7eef1; }
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --surface:#161f29; --surface-2:#1b2530; --inset:#121a22;
  --border:#2a3744; --border-strong:#38485a;
  --ink:#e7edf4; --ink-2:#a9b7c5; --ink-3:#73828f;
  --brand:#6aa6dd; --brand-2:#8fc0ea;
  --accent:#d79553; --accent-soft:#3a2b1b;
  --good:#54b485; --good-soft:#182c20;
  --warn:#d2a63f; --warn-soft:#2e2510;
  --bad:#e3756b; --bad-soft:#371d1a;
  --header-bg:#0c1319; --on-header:#e7eef6; --on-header-dim:#8ea2b6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.28);
  color-scheme:dark;
}
:root[data-flow="hartree"]:not([data-theme="light"]){ --accent:#4bb3c4; --accent-soft:#113038; }}
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#161f29; --surface-2:#1b2530; --inset:#121a22;
  --border:#2a3744; --border-strong:#38485a;
  --ink:#e7edf4; --ink-2:#a9b7c5; --ink-3:#73828f;
  --brand:#6aa6dd; --brand-2:#8fc0ea;
  --accent:#d79553; --accent-soft:#3a2b1b;
  --good:#54b485; --good-soft:#182c20;
  --warn:#d2a63f; --warn-soft:#2e2510;
  --bad:#e3756b; --bad-soft:#371d1a;
  --header-bg:#0c1319; --on-header:#e7eef6; --on-header-dim:#8ea2b6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.28);
  color-scheme:dark;
}
:root[data-theme="dark"][data-flow="hartree"]{ --accent:#4bb3c4; --accent-soft:#113038; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;font-size:15px;
  -webkit-font-smoothing:antialiased;letter-spacing:.005em;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--header-bg);z-index:60}
h1,h2,h3,h4{font-family:var(--disp);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-variant-ligatures:none}
img{max-width:100%}

.masthead{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--header-bg);color:var(--on-header);
  border-bottom:1px solid rgba(255,255,255,.08)}
.masthead-in{max-width:1220px;margin:0 auto;display:flex;align-items:center;gap:16px;padding-block:11px;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.brandmark{display:flex;align-items:center;gap:11px;min-width:0}
.hex{width:30px;height:30px;flex:none}
.wordmark{font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:.02em;line-height:1;color:#fff}
.wordmark span{color:var(--on-header-dim);font-weight:600}
.mast-sub{font-size:12px;color:var(--on-header-dim);line-height:1.2;margin-top:2px;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mast-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.conf-chip{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#f3d9c3;
  border:1px solid rgba(243,217,195,.4);border-radius:999px;padding:4px 9px;white-space:nowrap}
.theme-toggle{display:flex;border:1px solid rgba(255,255,255,.18);border-radius:999px;overflow:hidden}
.theme-toggle button{appearance:none;background:transparent;border:0;color:var(--on-header-dim);font-family:var(--sans);
  font-size:11px;font-weight:600;padding:5px 9px;cursor:pointer;letter-spacing:.03em}
.theme-toggle button[aria-pressed="true"]{background:rgba(255,255,255,.16);color:#fff}

.shell{max-width:1220px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:30px;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);align-self:start;max-height:calc(100vh - 92px);
  overflow:auto;padding:16px 0 40px}
.flow-tabs{display:flex;flex-direction:column;gap:6px;padding:0 6px 14px;margin-bottom:12px;border-bottom:1px solid var(--border)}
.flow-tab{appearance:none;cursor:pointer;text-align:left;border:1px solid var(--border);background:var(--surface);
  border-radius:10px;padding:9px 12px;font-family:var(--sans);color:var(--ink-2);display:flex;flex-direction:column;gap:2px}
.flow-tab .ft-t{font-weight:700;font-size:13px;color:var(--ink);display:flex;align-items:center;gap:7px}
.flow-tab .ft-s{font-size:11px;color:var(--ink-3)}
.flow-tab .ft-dot{width:9px;height:9px;border-radius:50%;flex:none}
.flow-tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.flow-tab:hover{border-color:var(--border-strong)}
.rail-h{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);padding:0 12px 7px}
.rail a{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink-2);text-decoration:none;padding:7px 12px;
  border-radius:8px;font-weight:500;border-left:2px solid transparent}
.rail a .rn{font-family:var(--mono);font-size:11px;color:var(--ink-3);min-width:16px}
.rail a:hover{background:var(--surface-2);color:var(--ink)}
.rail a.active{background:var(--accent-soft);color:var(--ink);border-left-color:var(--accent);font-weight:600}
.rail a.active .rn{color:var(--accent)}

main{min-width:0;padding:26px 0 90px}
section{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 82px);margin-bottom:46px}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.sec-no{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.04em}
.sec-head h2{font-size:25px;font-weight:700}
.sec-intro{color:var(--ink-2);margin:8px 0 20px;max-width:66ch}
.flow-banner{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border:1px solid var(--border);
  border-radius:12px;padding:12px 16px;margin-bottom:26px}
.flow-banner .fb-dot{width:11px;height:11px;border-radius:50%;flex:none}
.flow-banner .fb-t{font-family:var(--disp);font-weight:700;font-size:15px}
.flow-banner .fb-s{font-size:12.5px;color:var(--ink-2)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.card+.card{margin-top:14px}
.card h3{font-size:16px;font-weight:700;margin-bottom:3px}
.card h3.withtag{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.card .lead{color:var(--ink-2);font-size:14px;margin-bottom:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;
  border-radius:999px;text-transform:uppercase;white-space:nowrap}
.pill.brand{background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.flat{background:var(--inset);color:var(--ink-2)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:13px 15px;box-shadow:var(--shadow)}
.stat .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
.stat .v{font-family:var(--disp);font-weight:700;font-size:21px;margin-top:5px;line-height:1.1}
.stat .v small{font-family:var(--sans);font-weight:600;font-size:12px;color:var(--ink-2)}
.stat .n{font-size:11.5px;color:var(--ink-2);margin-top:3px}

.kv{display:grid;grid-template-columns:auto 1fr;gap:0}
.kv>div{display:contents}
.kv dt{font-weight:600;color:var(--ink-2);font-size:13px;padding:8px 14px 8px 0;border-bottom:1px solid var(--border)}
.kv dd{margin:0;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px;text-align:right}
.kv>div:last-child dt,.kv>div:last-child dd{border-bottom:0}

.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow);background:var(--surface)}
table.data{border-collapse:collapse;width:100%;font-size:13px;min-width:min-content}
table.data th,table.data td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--border);vertical-align:top;white-space:nowrap}
table.data thead th{background:var(--brand-2);color:#eef4fa;font-weight:600;font-size:11px;letter-spacing:.05em;
  text-transform:uppercase;position:sticky;top:0;white-space:nowrap}
table.data tbody tr:hover{background:var(--surface-2)}
table.data td.wrap{white-space:normal;min-width:200px}
table.data td .mono,table.data .mono{font-size:12.5px}
table.data .num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}
table.data tfoot td{font-weight:700;background:var(--inset);border-top:2px solid var(--border-strong)}
.cols-note{font-size:12px;color:var(--ink-3);margin-top:8px}
.coldef td:first-child{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:500;white-space:nowrap}
.coldef td:last-child{white-space:normal;color:var(--ink-2)}

ol.steps{margin:0;padding-left:0;list-style:none;counter-reset:s}
ol.steps li{position:relative;padding:3px 0 3px 30px;counter-increment:s;color:var(--ink-2);font-size:14px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:2px;width:20px;height:20px;background:var(--inset);
  color:var(--ink);border-radius:6px;font-family:var(--mono);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
ul.ticks{margin:0;padding:0;list-style:none}
ul.ticks li{position:relative;padding:4px 0 4px 24px;color:var(--ink-2);font-size:14px}
ul.ticks li::before{content:"";position:absolute;left:3px;top:11px;width:7px;height:7px;border-radius:2px;background:var(--accent)}

.ref{display:inline-flex;align-items:center;gap:7px;background:var(--inset);border:1px solid var(--border);border-radius:7px;
  padding:3px 4px 3px 9px;font-family:var(--mono);font-size:12.5px;color:var(--ink);max-width:100%}
.ref .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy-btn{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink-2);border-radius:5px;
  font-family:var(--sans);font-size:10.5px;font-weight:600;padding:3px 7px;cursor:pointer;flex:none;letter-spacing:.02em}
.copy-btn:hover{border-color:var(--accent);color:var(--accent)}
.copy-btn.ok{border-color:var(--good);color:var(--good)}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;padding:10px 13px;
  font-size:13px;color:var(--ink);margin-top:12px}
.callout.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.callout.tbc{border-left-color:var(--warn);background:var(--warn-soft)}
.callout b{font-weight:700}

.stepper-nav{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.stepper-nav button{flex:none;appearance:none;cursor:pointer;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:9px 13px;text-align:left;min-width:134px;font-family:var(--sans);color:var(--ink-2)}
.stepper-nav button .sn{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-weight:600}
.stepper-nav button .st{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin-top:3px;line-height:1.25;white-space:normal}
.stepper-nav button:hover{border-color:var(--border-strong)}
.stepper-nav button[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.stepper-nav button[aria-selected="true"] .sn{color:var(--accent)}
.step-panel .badge-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.step-panel h3{font-size:18px;margin-bottom:6px}
.doc-list{display:grid;gap:9px;margin-top:4px}
.doc-item{display:flex;gap:11px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:10px 12px}
.doc-item .dnum{font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;background:var(--accent);border-radius:6px;
  min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.doc-item .dbody{min-width:0}
.doc-item .dname{font-weight:600;font-size:13.5px}
.doc-item .dloc{font-size:12px;color:var(--ink-2);margin-top:3px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.progress-wrap{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.progress{flex:1;min-width:180px;height:9px;background:var(--inset);border-radius:999px;overflow:hidden;border:1px solid var(--border)}
.progress .bar{height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));width:0;transition:width .3s}
.progress-label{font-family:var(--mono);font-size:13px;font-weight:600;white-space:nowrap}
.btn-ghost{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink-2);border-radius:8px;
  font-family:var(--sans);font-size:12.5px;font-weight:600;padding:6px 12px;cursor:pointer}
.btn-ghost:hover{border-color:var(--bad);color:var(--bad)}
.check-row{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--border)}
.check-row:last-child{border-bottom:0}
.check-row.reserved{opacity:.5}
.check-row input[type=checkbox]{appearance:none;width:21px;height:21px;border:2px solid var(--border-strong);border-radius:6px;
  cursor:pointer;flex:none;margin-top:1px;position:relative;background:var(--surface)}
.check-row input[type=checkbox]:checked{background:var(--good);border-color:var(--good)}
.check-row input[type=checkbox]:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;
  border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.check-row input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.check-row .cl-num{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-weight:600}
.check-row .cl-title{font-weight:600;font-size:14.5px;margin:1px 0 2px}
.check-row.done .cl-title{color:var(--ink-3);text-decoration:line-through}
.check-row .cl-desc{font-size:13px;color:var(--ink-2)}

.contact-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ctbtn{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:8px;
  font-family:var(--sans);font-size:12.5px;font-weight:600;padding:7px 12px;cursor:pointer}
.ctbtn:hover{border-color:var(--accent);color:var(--accent)}
.ctbtn.ok{border-color:var(--good);color:var(--good)}
.contact-row{display:flex;gap:12px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.contact-row:last-child{border-bottom:0}
.cx-role{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:3px 7px;border-radius:5px;flex:none}
.cx-role.to{background:var(--accent);color:#fff}
.cx-role.cc{background:var(--inset);color:var(--ink-2);border:1px solid var(--border)}
.cx-name{font-weight:600;font-size:13.5px;min-width:0}
.cx-org{font-size:11.5px;color:var(--ink-3)}
.cx-mail{margin-left:auto;display:flex;align-items:center;gap:7px;min-width:0}
.cx-mail .em{font-family:var(--mono);font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.search-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search-in{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
  border-radius:9px;padding:9px 12px}
.search-in input{border:0;background:transparent;color:var(--ink);font-family:var(--sans);font-size:14px;width:100%;outline:none}
.search-in svg{flex:none;color:var(--ink-3)}
.search-meta{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.search-meta b{color:var(--ink);font-family:var(--mono)}
tr.hide{display:none}
.limit-bar{display:inline-block;height:6px;border-radius:3px;background:var(--accent);vertical-align:middle;min-width:2px}

.flow{display:grid;gap:12px}
.flow-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.flow-node{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.flow-node .fn-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.flow-node .fn-t{font-family:var(--disp);font-weight:700;font-size:14px}
.flow-node .fn-tag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);
  background:var(--accent-soft);border-radius:5px;padding:2px 6px}
.flow-node ul{margin:0;padding-left:16px;font-size:12.5px;color:var(--ink-2)}
.flow-arrow{text-align:center;color:var(--ink-3);font-size:18px;line-height:1}

.footnote{font-size:12px;color:var(--ink-3);margin-top:28px;padding-top:16px;border-top:1px solid var(--border);
  display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
[data-flow-doc]{display:none}
[data-flow-doc].on{display:block}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:10px 16px;border-radius:999px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr;gap:0}
  .rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:40;max-height:none;overflow:visible;
    background:var(--bg);margin:0 -4px;padding:9px 4px;border-bottom:1px solid var(--border)}
  .flow-tabs{flex-direction:row;border-bottom:0;padding:0 2px 8px;margin-bottom:8px}
  .flow-tab{flex:1}
  .rail-h{display:none}
  .rail nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;scrollbar-width:thin}
  .rail a{flex:none;border-left:0;border:1px solid var(--border);border-radius:999px;padding:6px 12px;white-space:nowrap}
  .rail a.active{border-color:var(--accent)}

F.FLOWS.hartree={label:'Hartree Rod Flow',sub:'Hartree buy-back · KAI – Hartree Partners UK – KRG',build:build};

/* ================= ENGINE ================= */
var root=document.documentElement;
var railNav=document.getElementById('railNav'),docEl=document.getElementById('doc'),mastSub=document.getElementById('mastSub');
var spy=null,current=null;
function buildRail(nav){railNav.innerHTML='<div class="rail-h">Sections</div>'+nav.map(function(n){return '<a href="#'+n[0]+'"><span class="rn">'+n[1]+'</span>'+esc(n[2])+'</a>';}).join('');}
function setActive(id){railNav.querySelectorAll('a').forEach(function(a){a.classList.toggle('active',a.getAttribute('href')==='#'+id);});}
function renderFlow(id,targetSection){
 if(!F.FLOWS[id])id='italy';current=id;
 root.setAttribute('data-flow',id);
 document.querySelectorAll('[data-flow-pick]').forEach(function(b){b.setAttribute('aria-selected',b.getAttribute('data-flow-pick')===id?'true':'false');});
 var out=F.FLOWS[id].build();
 docEl.innerHTML=out.html;
 buildRail(out.nav);
 if(mastSub)mastSub.textContent=F.FLOWS[id].sub;
 try{out.init(docEl);}catch(e){}
 LS_set('if_lastflow',id);
 if(spy)spy.disconnect();
 var secs=out.nav.map(function(n){return document.getElementById(n[0]);}).filter(Boolean);
 spy=new IntersectionObserver(function(ents){ents.forEach(function(en){if(en.isIntersecting)setActive(en.target.id);});},{rootMargin:'-45% 0px -50% 0px',threshold:0});
 secs.forEach(function(s){spy.observe(s);});
 railNav.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(ev){ev.preventDefault();var sid=a.getAttribute('href').slice(1),el=document.getElementById(sid);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});history.replaceState(null,'','#'+sid);setActive(sid);}});});
 if(targetSection){var t=document.getElementById(targetSection);if(t){setTimeout(function(){t.scrollIntoView({block:'start'});},60);setActive(targetSection);history.replaceState(null,'','#'+targetSection);}}
 else{setActive(out.nav[0][0]);window.scrollTo(0,0);}
}
function LS_set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function LS_get(k){try{return localStorage.getItem(k)}catch(e){return null}}
document.querySelectorAll('[data-flow-pick]').forEach(function(b){b.addEventListener('click',function(){renderFlow(b.getAttribute('data-flow-pick'));});});
window.addEventListener('hashchange',function(){var h=(location.hash||'').slice(1);if(!h)return;var fl=h.indexOf('ht-')===0?'hartree':h.indexOf('it-')===0?'italy':null;if(fl&&fl!==current)renderFlow(fl,h);else{var el=document.getElementById(h);if(el){el.scrollIntoView({block:'start'});setActive(h);}}});

/* boot */
(function(){var h=(location.hash||'').slice(1);
 if(h.indexOf('ht-')===0){renderFlow('hartree',h);return;}
 if(h.indexOf('it-')===0){renderFlow('italy',h);return;}
 var last=LS_get('if_lastflow');renderFlow(last==='hartree'?'hartree':'italy');})();
})();
</script>
